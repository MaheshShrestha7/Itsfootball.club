<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EF4444" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Shield Trim -->
  <path d="M 120,8 C 190,8 228,36 228,100 C 228,185 160,248 120,272 C 80,248 12,185 12,100 C 12,36 50,8 120,8 Z"
        fill="url(#goldTrim)" filter="url(#glow)"/>

  <!-- Secondary Crimson Rim -->
  <path d="M 120,15 C 184,15 219,41 219,100 C 219,179 156,238 120,261 C 84,238 21,179 21,100 C 21,41 56,15 120,15 Z"
        fill="url(#redAccent)"/>

  <!-- Inner Dark Shield Body -->
  <path d="M 120,23 C 178,23 209,47 209,100 C 209,173 151,228 120,249 C 89,228 31,173 31,100 C 31,47 62,23 120,23 Z"
        fill="url(#shieldGrad)"/>

  <!-- Subtle Shield Stripes -->
  <g opacity="0.12">
    <path d="M 85,25 L 85,230 L 105,240 L 105,25 Z" fill="#FFFFFF"/>
    <path d="M 135,25 L 135,240 L 155,230 L 155,25 Z" fill="#FFFFFF"/>
  </g>

  <!-- Golden Crown Topper -->
  <path d="M 96,44 L 108,60 L 120,42 L 132,60 L 144,44 L 140,70 L 100,70 Z"
        fill="url(#goldTrim)" stroke="#78350F" stroke-width="1"/>

  <!-- Heraldic Lion Rampant Silhouette -->
  <g fill="url(#goldTrim)">
    <!-- Lion Head & Mane -->
    <path d="M 115,76 C 123,73 132,77 135,84 C 137,88 135,93 130,94 C 134,96 135,100 133,103 C 130,107 125,106 122,109 C 120,112 122,118 118,121 C 114,124 109,120 107,116 C 103,117 101,113 103,109 C 99,109 97,105 100,102 C 98,99 101,95 103,94 C 101,91 104,87 108,86 C 107,81 110,77 115,76 Z"/>
    <!-- Lion Eye -->
    <circle cx="123" cy="85" r="2" fill="#78350F"/>
    <!-- Raised Forepaws with Claws -->
    <path d="M 133,96 C 142,93 148,87 154,82 C 156,84 154,88 150,91 C 145,95 139,99 135,102 Z"/>
    <path d="M 132,106 C 141,107 149,105 156,101 C 157,104 153,107 147,110 C 141,112 136,111 131,110 Z"/>
    <!-- Muscular Torso & Rearing Stance -->
    <path d="M 118,120 C 124,125 125,135 121,146 C 117,156 121,166 126,172 C 124,175 119,173 116,168 C 112,162 111,152 113,142 C 114,134 112,127 108,122 Z"/>
    <!-- Rearing Hind Legs -->
    <path d="M 118,165 C 127,170 137,174 145,183 C 147,185 144,188 140,187 C 134,185 127,178 122,174 Z"/>
    <path d="M 115,168 C 112,176 106,183 99,189 C 97,187 99,183 104,179 C 108,175 111,170 114,166 Z"/>
    <!-- Flourished Lion Tail -->
    <path d="M 113,144 C 103,138 97,126 95,114 C 93,115 94,119 97,125 C 101,133 105,141 110,147 C 106,149 101,146 98,142 C 94,136 96,128 92,124 C 91,128 92,135 96,143 C 100,150 106,155 112,154 Z"/>
  </g>

  <!-- Football / Soccer Ball Icon -->
  <g transform="translate(120, 198)">
    <circle cx="0" cy="0" r="15" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <polygon points="0,-6 6,-2 4,5 -4,5 -6,-2" fill="#0F172A"/>
    <line x1="0" y1="-6" x2="0" y2="-15" stroke="#0F172A" stroke-width="1.5"/>
    <line x1="6" y1="-2" x2="14" y2="-5" stroke="#0F172A" stroke-width="1.5"/>
    <line x1="4" y1="5" x2="10" y2="12" stroke="#0F172A" stroke-width="1.5"/>
    <line x1="-4" y1="5" x2="-10" y2="12" stroke="#0F172A" stroke-width="1.5"/>
    <line x1="-6" y1="-2" x2="-14" y2="-5" stroke="#0F172A" stroke-width="1.5"/>
  </g>

  <!-- Club Banner Ribbon -->
  <g transform="translate(120, 226)">
    <!-- Banner Shadow -->
    <path d="M -90,0 L 90,0 L 80,18 L -80,18 Z" fill="#78350F" opacity="0.6"/>
    <!-- Banner Body -->
    <path d="M -85,-3 L 85,-3 L 75,15 L -75,15 Z" fill="url(#goldTrim)" stroke="#B45309" stroke-width="1"/>
    <!-- Text -->
    <text x="0" y="9" font-family="'Outfit', 'Impact', sans-serif" font-size="11" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="1.5">RED LIONS FC</text>
  </g>

  <!-- Foundation Year -->
  <text x="120" y="244" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="800" fill="url(#goldTrim)" text-anchor="middle" letter-spacing="2">EST. 2018</text>
</svg>
